name: Build toolkit zip

# Rebuilds dist/iDezign-Toolkit.zip whenever the source the zip contains
# changes (PowerShell scripts, the manifest, the .bat launcher, the
# CHANGELOG, or the two logos packaged with the toolkit), and commits
# the fresh zip back to main. Manual run also available.
#
# No infinite loop: the bot's commit only touches dist/, and dist/ is
# NOT in the trigger paths below.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'CHANGELOG.txt'
      - 'logos/iDezign-ai-logo-v2-transparent.png'
      - 'logos/iDezign-logo-trim.png'
      - '.github/workflows/build-toolkit-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read toolkit version from manifest
        id: ver
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('scripts/iDezign_Versions.json'))['toolkitVersion'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Toolkit version: $VERSION"

      # ----------------------------------------------------------------
      # v2.6 follow-up: guard against the failure mode that bit us when
      # the manifest got bumped but the matching script change wasn't
      # pushed together. Compare every script's embedded $ScriptVersion
      # against what the manifest claims is its current version. If
      # ANY pair disagrees, fail the build BEFORE rebuilding the zip,
      # so a mismatched zip can never reach dist/.
      # ----------------------------------------------------------------
      - name: Verify scripts match the manifest
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, os, re, sys

          mf = json.load(open('scripts/iDezign_Versions.json'))
          expected = mf.get('scripts', {})
          pat = re.compile(r"""(?:\$ScriptVersion|\$script:ModuleVersion)\s*=\s*['\"]([^'\"]+)['\"]""")

          ok, mismatches, missing = [], [], []
          for fname, claimed in expected.items():
              # The manifest itself has no $ScriptVersion line - skip.
              if fname.lower().endswith('.json'):
                  ok.append((fname, '(manifest)'))
                  continue
              path = os.path.join('scripts', fname)
              if not os.path.isfile(path):
                  missing.append(fname)
                  continue
              text = open(path, encoding='utf-8').read()
              m = pat.search(text)
              if not m:
                  mismatches.append((fname, claimed, '(no $ScriptVersion line found)'))
                  continue
              actual = m.group(1)
              if actual == claimed:
                  ok.append((fname, actual))
              else:
                  mismatches.append((fname, claimed, actual))

          print('=== Version consistency check ===')
          for f, v in ok:
              print(f'  OK       {f}: {v}')
          for f in missing:
              print(f'  MISSING  {f} listed in manifest but file not found')

          if mismatches or missing:
              print()
              print('FAIL - some scripts do not match their manifest entries:')
              for f, claimed, actual in mismatches:
                  print(f'  {f}')
                  print(f'    manifest claims: {claimed}')
                  print(f'    file contains  : {actual}')
              for f in missing:
                  print(f'  {f} (file missing)')
              print()
              print('Fix by either:')
              print('  (a) bumping the file\'s $ScriptVersion to match the manifest, or')
              print('  (b) reverting the manifest entry to match the file.')
              sys.exit(1)

          print()
          print('All scripts match their manifest entries.')
          PYEOF

      # ----------------------------------------------------------------
      # v2.9.1 follow-up: the parse error that escaped to v2.9 (Sync
      # Drives' $ScriptVersion was placed BEFORE param(), which makes
      # PowerShell reject [CmdletBinding()] and refuse to load the
      # script) would have been caught here. Parse every .ps1/.psm1 in
      # scripts/ with the PowerShell language parser. Any syntax error
      # fails the build BEFORE the zip is rebuilt.
      # ----------------------------------------------------------------
      - name: Parse-check every PowerShell script
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path scripts -File | Where-Object { $_.Extension -in '.ps1','.psm1' } | ForEach-Object {
              $parseErrors = $null
              $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $errors++
                  Write-Host "FAIL: $($_.Name)" -ForegroundColor Red
                  foreach ($e in $parseErrors) {
                      Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)" -ForegroundColor Red
                  }
              } else {
                  Write-Host "OK  : $($_.Name)" -ForegroundColor Green
              }
          }
          if ($errors -gt 0) {
              Write-Host ""
              Write-Host "$errors script(s) failed to parse - aborting." -ForegroundColor Red
              exit 1
          }
          Write-Host ""
          Write-Host "All scripts parse cleanly." -ForegroundColor Green

      - name: Stage files for the zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          STAGE="$(mktemp -d)"
          echo "$STAGE" > /tmp/stage_path

          # PowerShell, manifest, batch launcher (flat in zip, no subdirs)
          for f in scripts/*.ps1 scripts/*.psm1 scripts/*.json scripts/*.bat; do
            cp "$f" "$STAGE/"
          done

          # Brand assets the launcher displays
          cp logos/iDezign-ai-logo-v2-transparent.png "$STAGE/"
          cp logos/iDezign-logo-trim.png "$STAGE/"

          # Tiny launcher.cmd for the SFX RunProgram (no space in filename,
          # avoids chrislake SFX quote-escaping issues with "iDezign TOOLKIT.bat").
          # When the SFX extracts to %LOCALAPPDATA%, it runs this; this script
          # then calls the actual .bat which handles UAC elevation.
          printf '%s\r\n' '@echo off' 'cd /d "%~dp0"' 'call "iDezign TOOLKIT.bat"' > "$STAGE/launcher.cmd"

          # Changelog (so end users see what changed)
          cp CHANGELOG.txt "$STAGE/"

          echo "--- staged ---"
          ls -la "$STAGE"

      - name: Build the zip
        run: |
          set -euo pipefail
          STAGE=$(cat /tmp/stage_path)
          mkdir -p dist
          rm -f dist/iDezign-Toolkit.zip
          # -X strips extra file attributes for cleaner archives
          (cd "$STAGE" && zip -X -r "$GITHUB_WORKSPACE/dist/iDezign-Toolkit.zip" .)
          echo "--- zip contents ---"
          unzip -l dist/iDezign-Toolkit.zip

      # ----------------------------------------------------------------
      # v2.9.2 add-on: also build dist/iDezign-Toolkit.exe (a self-
      # extracting EXE) alongside the zip. Double-click extracts the
      # toolkit silently to %LOCALAPPDATA%\iDezign-Toolkit and runs
      # the GUI. Both files ship with every release; users pick
      # whichever suits their environment (.zip avoids SmartScreen
      # warnings on first download but needs unzip-then-run; .exe is
      # one-click but may trigger SmartScreen until reputation builds).
      # ----------------------------------------------------------------
      - name: Download SFX module (chrislake/7zsfxmm)
        run: |
          set -euo pipefail
          # 7-Zip's own Extra packages dropped SFX modules in newer versions
          # (verified empty in 23.01 and 26.02). chrislake/7zsfxmm is the
          # community-maintained source. Pinned to 1.7.1.3901 for repro.
          # The release ships a .7z archive containing the SFX modules.
          mkdir -p /tmp/7z-sfx-dl /tmp/7z-sfx
          curl -fL --retry 3 -o /tmp/7z-sfx-dl/sfx.7z https://github.com/chrislake/7zsfxmm/releases/download/1.7.1.3901/7zsd_171_3901.7z
          7z x -y /tmp/7z-sfx-dl/sfx.7z -o/tmp/7z-sfx
          echo "--- Extracted contents ---"
          find /tmp/7z-sfx -type f | head -20
          echo "--- SFX modules found ---"
          find /tmp/7z-sfx -type f -iname '*.sfx'

      - name: Build self-extracting EXE
        run: |
          set -euo pipefail
          STAGE=$(cat /tmp/stage_path)

          # Pack the staged toolkit files into a .7z archive (max compression)
          rm -f /tmp/toolkit-inner.7z
          (cd "$STAGE" && 7z a -mx=9 -m0=lzma /tmp/toolkit-inner.7z .)

          # Locate the silent SFX module. Prefer 64-bit silent variants.
          SFX=""
          for cand in 7zsd_All_x64.sfx 7zsd_All.sfx 7zsd_LZMA_x64.sfx 7zsd_LZMA.sfx 7zsd.sfx 7zSD.sfx; do
            found=$(find /tmp/7z-sfx -type f -name "$cand" | head -1)
            if [ -n "$found" ]; then
              SFX="$found"
              echo "Selected SFX module: $cand -> $found"
              break
            fi
          done
          if [ -z "$SFX" ]; then
            SFX=$(find /tmp/7z-sfx -type f -iname '*.sfx' | head -1)
            if [ -z "$SFX" ]; then
              echo "ERROR: no SFX module found in /tmp/7z-sfx"
              find /tmp/7z-sfx -type f
              exit 1
            fi
            echo "Fallback SFX: $SFX"
          fi

          # SFX configuration block
          #   Directory     - extracts to per-user LocalAppData (no admin)
          #   RunProgram    - launches the .bat after extraction
          #   GUIMode 2     - silent (no extraction dialog)
          #   OverwriteMode - overwrite without prompt (re-runs upgrade in place)
          cat > /tmp/sfxconfig.txt << 'CONFEOF'
          ;!@Install@!UTF-8!
          Title="iDezign Toolkit"
          Progress="no"
          Directory="%LOCALAPPDATA%\iDezign-Toolkit"
          RunProgram="launcher.cmd"
          GUIMode="2"
          OverwriteMode="1"
          ;!@InstallEnd@!
          CONFEOF

          # Concatenate: SFX stub + config + 7z archive = Windows .exe
          mkdir -p dist
          rm -f dist/iDezign-Toolkit.exe
          cat "$SFX" /tmp/sfxconfig.txt /tmp/toolkit-inner.7z > dist/iDezign-Toolkit.exe

          echo "--- Built .exe ---"
          ls -la dist/iDezign-Toolkit.exe
          file dist/iDezign-Toolkit.exe

      - name: Commit zip + exe back to main (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- dist/iDezign-Toolkit.zip dist/iDezign-Toolkit.exe; then
            echo "dist/ assets unchanged \u2014 nothing to commit."
            exit 0
          fi

          git add dist/iDezign-Toolkit.zip dist/iDezign-Toolkit.exe
          git commit -m "chore(toolkit): rebuild zip + exe (v${{ steps.ver.outputs.version }})"
          git push
