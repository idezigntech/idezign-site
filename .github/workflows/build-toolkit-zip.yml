name: Build toolkit zip

# Rebuilds dist/iDezign-Toolkit.zip whenever the source the zip contains
# changes (PowerShell scripts, the manifest, the .bat launcher, the
# CHANGELOG, or the two logos packaged with the toolkit), and commits
# the fresh zip back to main. Manual run also available.
#
# No infinite loop: the bot's commit only touches dist/, and dist/ is
# NOT in the trigger paths below.
#
# v3.2 addition: after building, if a GitHub Release matching the
# current toolkitVersion exists (tag v{ver}), upload the freshly-built
# .zip and .exe as release assets (with --clobber so re-runs replace
# stale copies). This keeps the "Download from GitHub Releases" fallback
# link on idezign.ai/toolkit alive - previously the SmartScreen-bypass
# fallback URL 404'd because no assets were ever attached to releases.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'CHANGELOG.txt'
      - 'logos/iDezign-ai-logo-v2-transparent.png'
      - 'logos/iDezign-logo-trim.png'
      - '.github/workflows/build-toolkit-zip.yml'
  workflow_dispatch:
  release:
    types: [published, released]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read toolkit version from manifest
        id: ver
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('scripts/iDezign_Versions.json'))['toolkitVersion'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Toolkit version: $VERSION"

      # ----------------------------------------------------------------
      # v2.6 follow-up: guard against the failure mode that bit us when
      # the manifest got bumped but the matching script change wasn't
      # pushed together. Compare every script's embedded $ScriptVersion
      # against what the manifest claims is its current version. If
      # ANY pair disagrees, fail the build BEFORE rebuilding the zip,
      # so a mismatched zip can never reach dist/.
      # ----------------------------------------------------------------
      - name: Verify scripts match the manifest
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, os, re, sys

          mf = json.load(open('scripts/iDezign_Versions.json'))
          expected = mf.get('scripts', {})
          pat = re.compile(r"""(?:\$ScriptVersion|\$script:ModuleVersion)\s*=\s*['\"]([^'\"]+)['\"]""")

          ok, mismatches, missing = [], [], []
          for fname, claimed in expected.items():
              if fname.lower().endswith('.json'):
                  ok.append((fname, '(manifest)'))
                  continue
              path = os.path.join('scripts', fname)
              if not os.path.isfile(path):
                  missing.append(fname)
                  continue
              text = open(path, encoding='utf-8').read()
              m = pat.search(text)
              if not m:
                  mismatches.append((fname, claimed, '(no $ScriptVersion line found)'))
                  continue
              actual = m.group(1)
              if actual == claimed:
                  ok.append((fname, actual))
              else:
                  mismatches.append((fname, claimed, actual))

          print('=== Version consistency check ===')
          for f, v in ok:
              print(f'  OK       {f}: {v}')
          for f in missing:
              print(f'  MISSING  {f} listed in manifest but file not found')

          if mismatches or missing:
              print()
              print('FAIL - some scripts do not match their manifest entries:')
              for f, claimed, actual in mismatches:
                  print(f'  {f}')
                  print(f'    manifest claims: {claimed}')
                  print(f'    file contains  : {actual}')
              for f in missing:
                  print(f'  {f} (file missing)')
              print()
              print('Fix by either:')
              print('  (a) bumping the file\'s $ScriptVersion to match the manifest, or')
              print('  (b) reverting the manifest entry to match the file.')
              sys.exit(1)

          print()
          print('All scripts match their manifest entries.')
          PYEOF

      - name: Parse-check every PowerShell script
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path scripts -File | Where-Object { $_.Extension -in '.ps1','.psm1' } | ForEach-Object {
              $parseErrors = $null
              $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $errors++
                  Write-Host "FAIL: $($_.Name)" -ForegroundColor Red
                  foreach ($e in $parseErrors) {
                      Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)" -ForegroundColor Red
                  }
              } else {
                  Write-Host "OK  : $($_.Name)" -ForegroundColor Green
              }
          }
          if ($errors -gt 0) {
              Write-Host ""
              Write-Host "$errors script(s) failed to parse - aborting." -ForegroundColor Red
              exit 1
          }
          Write-Host ""
          Write-Host "All scripts parse cleanly." -ForegroundColor Green

      - name: Stage files for the zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          STAGE="$(mktemp -d)"
          echo "$STAGE" > /tmp/stage_path

          for f in scripts/*.ps1 scripts/*.psm1 scripts/*.json scripts/*.bat; do
            cp "$f" "$STAGE/"
          done

          cp logos/iDezign-ai-logo-v2-transparent.png "$STAGE/"
          cp logos/iDezign-logo-trim.png "$STAGE/"
          cp CHANGELOG.txt "$STAGE/"

          echo "--- staged ---"
          ls -la "$STAGE"

      - name: Build the zip
        run: |
          set -euo pipefail
          STAGE=$(cat /tmp/stage_path)
          mkdir -p dist
          rm -f dist/iDezign-Toolkit.zip
          (cd "$STAGE" && zip -X -r "$GITHUB_WORKSPACE/dist/iDezign-Toolkit.zip" .)
          echo "--- zip contents ---"
          unzip -l dist/iDezign-Toolkit.zip

      - name: Install NSIS (modern Windows installer maker)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y nsis
          makensis -VERSION

      - name: Build self-extracting EXE (NSIS)
        run: |
          set -euo pipefail
          STAGE=$(cat /tmp/stage_path)

          cat > /tmp/toolkit.nsi << 'NSIEOF'
          Unicode true
          Name "iDezign Toolkit"
          OutFile "${OUTFILE}"
          SilentInstall silent
          InstallDir "$LOCALAPPDATA\iDezign-Toolkit"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma

          Section
            SetOutPath $INSTDIR
            File /r "${STAGE}/*"
            Exec '"$INSTDIR\iDezign TOOLKIT.bat"'
          SectionEnd
          NSIEOF

          mkdir -p dist
          rm -f dist/iDezign-Toolkit.exe
          makensis -V2 -DOUTFILE="$GITHUB_WORKSPACE/dist/iDezign-Toolkit.exe" -DSTAGE="$STAGE" /tmp/toolkit.nsi

          echo "--- Built .exe ---"
          ls -la dist/iDezign-Toolkit.exe
          file dist/iDezign-Toolkit.exe

      - name: Commit zip + exe back to main (if changed)
        # Only meaningful on branch triggers. On 'release: published', the
        # runner is on a detached HEAD at the tag - git push has no branch
        # to target, so we skip and let the release-upload step run.
        if: github.event_name != 'release'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- dist/iDezign-Toolkit.zip dist/iDezign-Toolkit.exe; then
            echo "dist/ assets unchanged - nothing to commit."
            exit 0
          fi

          git add dist/iDezign-Toolkit.zip dist/iDezign-Toolkit.exe
          git commit -m "chore(toolkit): rebuild zip + exe (v${{ steps.ver.outputs.version }})"
          git push

      # ----------------------------------------------------------------
      # v3.2 addition: attach dist/ assets to the matching GitHub Release
      # (if one exists for the current toolkitVersion). This fills the
      # gap that made /releases/latest/download/iDezign-Toolkit.exe 404 -
      # previously, releases were cut but assets were never uploaded.
      #
      # Behavior:
      #   - Trigger 'release: published' -> assets ready + we know the
      #     matching tag, so upload immediately.
      #   - Trigger 'push to main' or 'workflow_dispatch' -> check if a
      #     release with tag v{ver} exists; if yes, upload with --clobber;
      #     if no, no-op (assets stay in dist/ waiting for the release).
      # ----------------------------------------------------------------
      - name: Attach dist/ assets to matching release (if it exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v$VERSION"

          # Determine which tag to attach to. On 'release' event use the
          # tag that fired it (in case of hotfix numbering differences);
          # otherwise use the manifest version.
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_EVENT_NAME:-}" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists - uploading assets..."
            gh release upload "$TAG" \
              dist/iDezign-Toolkit.zip \
              dist/iDezign-Toolkit.exe \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            echo "Assets uploaded to release $TAG:"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          else
            echo "No release with tag $TAG yet - skipping asset upload."
            echo "  (Assets will be attached when release is cut, or when this workflow re-runs after the release exists.)"
          fi

      # ----------------------------------------------------------------
      # v3.4 addition: purge jsDelivr's cache for the two JSON files the
      # idezign.ai/toolkit page fetches at runtime. jsDelivr caches
      # @main branch files for up to 12 HOURS, so without this purge the
      # site kept showing a stale toolkitVersion (old badge, old tool
      # list, download links pointing at the previous release) for up to
      # half a day after every release. The ?t= cache-buster in the page
      # only bypasses the BROWSER cache, not jsDelivr's edge servers.
      #
      # Fail-soft: a purge hiccup should never fail the build - worst
      # case the cache just expires on its own within 12h as before.
      # ----------------------------------------------------------------
      - name: Purge jsDelivr cache (site reads manifest through it)
        if: always()
        run: |
          for f in iDezign_Versions.json iDezign_SiteContent.json; do
            echo "Purging: $f"
            curl -fsS --max-time 30 --retry 2 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/scripts/$f" \
              && echo "" || echo "WARN: purge failed for $f (cache will expire on its own within 12h)"
          done
          echo "jsDelivr purge done - idezign.ai/toolkit will pick up the new manifest on next load."
